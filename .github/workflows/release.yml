name: Release

# Push a version tag to cut a signed, notarized release and auto-update users:
#   git tag v0.1.1 && git push origin v0.1.1
#
# Requires the secrets documented in .github/RELEASE_SECRETS.md. The signing
# identity, notary API key, Sparkle key, and tap token all live as repo secrets;
# see that doc for the security posture (use a protected `release` environment
# with required reviewers).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release and push appcast.xml to gh-pages

jobs:
  release:
    runs-on: macos-15
    environment: release   # configure required reviewers in repo Settings → Environments
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # package-app.sh derives the build number from `git rev-list --count`

      - name: Resolve + validate version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}   # via env, not inline ${{ }}, to avoid injection
        run: |
          # Strict vX.Y.Z only. Rejects any tag with shell metacharacters, so the
          # version is provably safe to use downstream.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$TAG' must be vX.Y.Z" >&2; exit 1
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD:   ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"   # ephemeral keychain password
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          # Put the temp keychain first in the search list so codesign + auto-detect find the identity.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/[":]//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"

      - name: Resolve dependencies (Sparkle)
        run: swift package resolve

      - name: Build, sign, notarize, DMG, appcast
        env:
          AC_API_KEY_ID:        ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID:     ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_PATH:      ${{ runner.temp }}/ac_api_key.p8
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          V:   ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          ./scripts/package-app.sh "$V"
          ./scripts/sign-and-notarize.sh
          ./scripts/make-dmg.sh "$V"
          APPCAST_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" ./scripts/update-appcast.sh

      - name: Create GitHub Release + upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          V:   ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" "build/MeetingGenie-${V}.dmg" \
            --title "MeetingGenie ${V}" --generate-notes

      - name: Publish appcast.xml to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp"
          cp build/appcast.xml "$tmp/appcast.xml"
          git -C "$tmp" add appcast.xml
          git -C "$tmp" -c user.email="actions@github.com" -c user.name="github-actions[bot]" \
            commit -m "Publish appcast for ${TAG}" || echo "no appcast change"
          git -C "$tmp" push origin gh-pages

      - name: Bump cask in the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          SHA="$(shasum -a 256 "build/MeetingGenie-${V}.dmg" | awk '{print $1}')"
          tmp="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/fontesgerards/homebrew-meetinggenie-tap.git" "$tmp"
          # version + sha256 are the only per-release lines; the url uses #{version}.
          sed -i '' -E "s/^  version \".*\"/  version \"${V}\"/" "$tmp/Casks/meetinggenie.rb"
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$tmp/Casks/meetinggenie.rb"
          git -C "$tmp" add Casks/meetinggenie.rb
          git -C "$tmp" -c user.email="actions@github.com" -c user.name="github-actions[bot]" \
            commit -m "meetinggenie ${V}"
          git -C "$tmp" push origin HEAD
